name: 抓取台股盤後數據與國際行情

# 為什麼需要這個 workflow：
# 產生 dashboard 的 Claude session 執行在一個有出網限制的環境裡，
# 證交所／櫃買／期交所全部被 egress proxy 擋掉（403），因此融資融券、
# 櫃買指數、台指期基差等只存在於交易所表格裡的數字抓不到。
# GitHub Actions 的 runner 沒有這個限制，所以由它負責抓精確數字，
# Claude 隔天早上讀 data/market-auto.js 與 data/market-global.js 來寫判斷。
# 國際行情（SOX、原油、黃金、USD/JPY 等）同樣抓不到，因為那些數字只在
# 新聞句子裡偶爾出現，搜尋不可靠——故一併由本 workflow 抓取。

on:
  schedule:
    # 11:00 UTC = 19:00 台灣時間（週一～週五）
    # 台股 13:30 收盤。原訂 17:00 抓，但 8/17 首次全自動執行時證交所
    # 融資融券當日資料尚未發布（回「無資料」），故延後至 19:00。
    - cron: "0 11 * * 1-5"
    # 23:00 UTC = 隔天 07:00 台灣時間（週二～週六），重抓「前一交易日」。
    # 19:00 那次仍取不到融資融券（證交所發布更晚），但次日上午已可取得，
    # 故補這一次，剛好趕在每日 07:32 更新流程之前 30 分鐘。
    - cron: "0 23 * * 1-5"
  workflow_dispatch:          # 手動觸發，用於驗證與補抓
    inputs:
      date:
        description: "指定日期 YYYYMMDD（留空 = 今天）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-tw-market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 決定抓取日期
        id: pick
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            D="${{ inputs.date }}"                       # 手動指定
          elif [ "$(date -u +%H)" = "23" ]; then
            D="$(TZ=Asia/Taipei date -d yesterday +%Y%m%d)"  # 隔天早上那次：抓前一交易日
          else
            D="$(TZ=Asia/Taipei date +%Y%m%d)"           # 傍晚那次：抓當天
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "抓取日期：$D"

      - name: 抓取台股數據
        run: node scripts/fetch-tw-market.mjs ${{ steps.pick.outputs.date }}

      - name: 抓取國際行情
        run: node scripts/fetch-global-market.mjs
        continue-on-error: true      # 國際行情失敗不影響台股數據 commit

      - name: 摘要
        run: |
          node -e "
            global.window = {};
            require('./data/market-auto.js');
            const m = window.MARKET_AUTO;
            console.log('抓取時間:', m.fetchedAt);
            console.log('交易日:', m.tradeDate, '| 成功:', m.okCount + '/' + m.totalCount);
            for (const [k, v] of Object.entries(m.items)) {
              console.log((v.ok ? '  ✅ ' : '  ❌ ') + k + (v.ok ? '' : ' — ' + v.error));
            }
            try {
              global.window = {};
              require('./data/market-global.js');
              const g = window.MARKET_GLOBAL;
              console.log('--- 國際行情 ---');
              console.log('抓取時間:', g.fetchedAt, '| 成功:', g.okCount + '/' + g.totalCount);
              for (const [k, v] of Object.entries(g.items)) {
                console.log((v.ok ? '  ✅ ' : '  ❌ ') + k + (v.ok ? ' = ' + v.value.close : ''));
              }
            } catch (e) { console.log('（尚無 market-global.js）'); }
          "

      - name: Commit 並推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-auto.js data/market-global.js
          if git diff --staged --quiet; then
            echo "沒有變化，不產生 commit"
          else
            git commit -m "chore(data): 行情數據 $(TZ=Asia/Taipei date +%Y/%m/%d)"
            git push
          fi
