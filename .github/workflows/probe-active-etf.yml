name: 探測主動式ETF持股資料來源

# 只在手動觸發時執行，不寫任何資料檔。
# 用途是把一批候選的主動式ETF持股來源打一遍、把實際回應印進 log，
# 用來判斷哪個來源可以穩定解析。產生 dashboard 的 session 對外部網域
# 被 egress proxy 擋掉（403），只有 Actions runner 連得上，所以探測必須在這裡做。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 探測
        run: node scripts/probe-active-etf.mjs
