name: 抓取主動式ETF持股明細

# 台股主動式ETF每日持股明細（來源：MoneyDJ，見 scripts/fetch-active-etf.mjs
# 開頭說明）。主動式ETF的持股通常在收盤後由投信公告、次個交易日上午可查到
# 更新，排程時間與既有的台股盤後數據抓取（fetch-tw-market.yml）錯開半小時，
# 避免同時觸發 git push 衝突。

on:
  schedule:
    # 23:30 UTC = 隔天 07:30 台灣時間（週二～週六）
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-active-etf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 抓取主動式ETF持股
        run: node scripts/fetch-active-etf.mjs

      - name: Commit 並推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/active-etf.js data/active-etf-snapshot.json
          if git diff --staged --quiet; then
            echo "沒有變化，不產生 commit"
          else
            git commit -m "chore(data): 主動式ETF持股 $(TZ=Asia/Taipei date +%Y/%m/%d)"
            # 這個 workflow 跟 fetch-tw-market.yml 常常幾乎同時觸發（手動補跑時
            # 尤其容易撞上），push 被拒絕就 rebase 到最新 main 再試一次。
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push 被拒絕，第 $i 次重試：rebase 到最新 main"
              git fetch origin main
              git rebase origin/main
              sleep $((i * 3))
            done
          fi
